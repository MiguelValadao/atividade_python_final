{% extends "base.html" %}

{% block titulo %}Editar Tarefa — Painel de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">
                    <i class="bi bi-pencil-square me-1"></i>Editar Tarefa
                </h2>
                <form method="post" action="{{ url_for('editar_tarefa', tarefa_id=tarefa['id']) }}" novalidate>
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required
                               value="{{ tarefa['titulo'] }}" maxlength="120">
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4"
                                  placeholder="Detalhes da tarefa (opcional)">{{ tarefa['descricao'] or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            {% for chave, rotulo in status_labels.items() %}
                            <option value="{{ chave }}" {% if tarefa['status'] == chave %}selected{% endif %}>
                                {{ rotulo }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Salvar alterações
                        </button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">
                            <i class="bi bi-arrow-left me-1"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
