{% extends "base.html" %}

{% block titulo %}Registro — Painel de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-person-plus"></i> Criar Conta
                </h2>
                <form method="post" action="{{ url_for('registro') }}" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" required
                               placeholder="Seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required
                               placeholder="seu@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required
                               placeholder="Mínimo de 6 caracteres">
                    </div>
                    <div class="mb-3">
                        <label for="confirmacao" class="form-label">Confirmar senha</label>
                        <input type="password" class="form-control" id="confirmacao" name="confirmacao" required
                               placeholder="Repita a senha">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-person-check me-1"></i>Cadastrar
                    </button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
