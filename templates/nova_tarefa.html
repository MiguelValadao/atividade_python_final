{% extends "base.html" %}

{% block titulo %}Nova Tarefa — Painel de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">
                    <i class="bi bi-plus-circle me-1"></i>Nova Tarefa
                </h2>
                <form method="post" action="{{ url_for('nova_tarefa') }}" novalidate>
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required
                               placeholder="Ex.: Estudar Flask" maxlength="120">
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4"
                                  placeholder="Detalhes da tarefa (opcional)"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            {% for chave, rotulo in status_labels.items() %}
                            <option value="{{ chave }}">{{ rotulo }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">
                            <i class="bi bi-arrow-left me-1"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
